<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1890ff" />
  <title>东北育才沈抚示范学校家校互动平台</title>
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <!-- 使用 PUBLIC_URL 动态注入路径 -->
  <link href="/reaction/static/css/main.26869d1d.css" rel="stylesheet">
</head>

<body>
  <div id="root"></div>

  <!-- 移除 autoplay，通过按钮触发播放 -->
  <audio id="bgm1" src="/reaction/static/media/Thinking out Loud.mp3" loop></audio>

  <!-- 添加播放按钮 -->
  <button id="playBgm" style="position: fixed; bottom: 20px; right: 20px; padding: 10px;">
    点击播放背景音乐
  </button>

  <script>
    // 用户点击后播放音乐
    document.getElementById('playBgm').addEventListener('click', () => {
      const audio = document.getElementById('bgm1');
      audio.play().catch(error => {
        console.log('播放失败:', error);
      });
    });
  </script>
</body>
</html>
